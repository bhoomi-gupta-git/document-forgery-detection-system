<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <!-- Background document stack -->
  <rect x="55" y="60" width="100" height="120" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="62" y="52" width="100" height="120" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="70" y="44" width="100" height="120" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Document fold corner -->
  <path d="M150 44 L170 44 L170 64 Z" fill="#E5E7EB"/>
  <path d="M150 44 L150 64 L170 64" stroke="#D1D5DB" stroke-width="1.5" fill="none"/>

  <!-- Document lines (content placeholder) -->
  <rect x="84" y="76" width="60" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="84" y="90" width="72" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="84" y="102" width="56" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="84" y="114" width="68" height="4" rx="2" fill="#F3F4F6"/>
  <rect x="84" y="126" width="44" height="4" rx="2" fill="#F3F4F6"/>

  <!-- Magnifying glass -->
  <circle cx="158" cy="130" r="22" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="158" cy="130" r="14" fill="#EEF2FF" stroke="#3B6FFF" stroke-width="2"/>
  <line x1="168" y1="141" x2="178" y2="153" stroke="#3B6FFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Question mark inside magnifier -->
  <text x="154" y="136" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#3B6FFF">?</text>

  <!-- Small sparkles -->
  <circle cx="52" cy="50" r="3" fill="#3B6FFF" opacity="0.3"/>
  <circle cx="186" cy="55" r="2" fill="#3B6FFF" opacity="0.4"/>
  <circle cx="44" cy="150" r="2" fill="#E05C2A" opacity="0.3"/>
  <line x1="190" y1="90" x2="190" y2="98" stroke="#3B6FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="186" y1="94" x2="194" y2="94" stroke="#3B6FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>